name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build (GUI subsystem)
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o fanf9ctl.exe .

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanf9ctl-windows-amd64
          path: fanf9ctl.exe
          if-no-files-found: error

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fanf9ctl.exe
          generate_release_notes: true
